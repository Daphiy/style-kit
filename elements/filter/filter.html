<!doctype html>
<meta charset="utf-8">
<title>Filter panel preview</title>
<link rel="stylesheet" href="../_preview/preview.css">
<link rel="stylesheet" href="../toggles/segmented.css">
<link rel="stylesheet" href="../toggles/multiselect.css">
<link rel="stylesheet" href="filter.css">
<style>
  .stage { width: 480px; background: transparent; padding: 0; }
</style>
<div class="stage">
  <div class="filter-card">
    <div class="filter-card__header">
      <h2 class="filter-card__title">Filter</h2>
      <button class="filter-reset">Reset filters</button>
    </div>

    <div class="filter-section">
      <div class="segmented" role="radiogroup" aria-label="Property type">
        <button class="segmented__option" role="radio" aria-checked="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.5 7 8 2.5 13.5 7v6.5h-11z"/><path d="M6.5 13.5V10h3v3.5"/></svg>House
        </button>
        <button class="segmented__option" role="radio" aria-checked="false">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="2.5" width="10" height="11"/><path d="M5.5 5h1M9.5 5h1M5.5 7.5h1M9.5 7.5h1M5.5 10h1M9.5 10h1"/></svg>Condo
        </button>
        <button class="segmented__option" role="radio" aria-checked="false">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.5 13.5V6l5-3v10.5M7.5 6.5l6 2v5h-11"/></svg>Other
        </button>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-section__head"><h3 class="filter-section__title" id="bed">Bedrooms</h3></div>
      <div class="segmented" role="radiogroup" aria-labelledby="bed">
        <button class="segmented__option" role="radio" aria-checked="true">Any</button>
        <button class="segmented__option" role="radio" aria-checked="false">1</button>
        <button class="segmented__option" role="radio" aria-checked="false">2</button>
        <button class="segmented__option" role="radio" aria-checked="false">3</button>
        <button class="segmented__option" role="radio" aria-checked="false">4</button>
        <button class="segmented__option" role="radio" aria-checked="false">5</button>
      </div>
    </div>

    <div class="filter-section filter-section--group">
      <div class="filter-section__head"><h3 class="filter-section__title" id="amen">Amenities</h3></div>
      <div class="chip-group" role="group" aria-labelledby="amen">
        <button class="chip" aria-pressed="false">
          <svg class="chip__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 6.5a8.5 8.5 0 0 1 12 0M4 8.8a5.6 5.6 0 0 1 8 0M6 11a2.8 2.8 0 0 1 4 0"/><circle cx="8" cy="13" r=".6" fill="currentColor"/></svg>
          <span class="chip__check"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.2 4.2 7.3 8 3"/></svg></span>
          Wifi
        </button>
        <button class="chip" aria-pressed="true">
          <svg class="chip__icon" viewBox="0 0 16 16"></svg>
          <span class="chip__check"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.2 4.2 7.3 8 3"/></svg></span>
          Ocean View
        </button>
        <button class="chip" aria-pressed="false">
          <svg class="chip__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M2 7.5 8 3l6 4.5M3.5 6.5v7h9v-7M6 13.5V10h4v3.5"/></svg>
          <span class="chip__check"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.2 4.2 7.3 8 3"/></svg></span>
          Beach Access
        </button>
        <button class="chip" aria-pressed="false">
          <svg class="chip__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 9.5h12M3.5 9.5v4M12.5 9.5v4M5 9.5V6.5h3v3M9.5 3.5v2"/></svg>
          <span class="chip__check"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.2 4.2 7.3 8 3"/></svg></span>
          Workspace
        </button>
        <button class="chip" aria-pressed="true">
          <svg class="chip__icon" viewBox="0 0 16 16"></svg>
          <span class="chip__check"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.2 4.2 7.3 8 3"/></svg></span>
          Shower
        </button>
      </div>
      <a class="filter-search" href="#">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
        Search for 59 amenities
      </a>
    </div>
  </div>
</div>
