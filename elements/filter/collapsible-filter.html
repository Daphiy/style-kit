<!doctype html>
<meta charset="utf-8">
<title>Collapsible filter preview</title>
<link rel="stylesheet" href="../_preview/preview.css">
<link rel="stylesheet" href="../buttons/buttons.css">
<link rel="stylesheet" href="../forms/forms.css">
<link rel="stylesheet" href="collapsible-filter.css">
<style>
  .stage { width: 414px; }
</style>
<div class="stage">
  <div class="collapsible-filter">

    <details class="collapsible" open>
      <summary class="collapsible__head">
        <span class="collapsible__title">Price Range</span>
        <span class="btn btn--ghost btn--icon-sm collapsible__chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
      </summary>
      <div class="collapsible__content">
        <div class="cf-row cf-row--field">
          <label class="label" for="min-price">Min Price</label>
          <input class="input" id="min-price" type="number" placeholder="0">
        </div>
        <div class="cf-row cf-row--field">
          <label class="label" for="max-price">Max Price</label>
          <input class="input" id="max-price" type="number" placeholder="1000">
        </div>
      </div>
    </details>

    <hr class="separator">

    <details class="collapsible" open>
      <summary class="collapsible__head">
        <span class="collapsible__title">Customer Ratings</span>
        <span class="btn btn--ghost btn--icon-sm collapsible__chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
      </summary>
      <div class="collapsible__content">
        <div class="cf-row">
          <input class="checkbox" type="checkbox" id="rating-4" checked>
          <label class="label" for="rating-4"><span class="cf-rating">4 <svg class="cf-star" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round"><path d="M11.5 2.3a.6.6 0 0 1 1 0l2.6 5.3 5.8.8a.6.6 0 0 1 .3 1l-4.2 4.1 1 5.8a.6.6 0 0 1-.8.6L12 17.2l-5.2 2.7a.6.6 0 0 1-.8-.6l1-5.8-4.2-4.1a.6.6 0 0 1 .3-1l5.8-.8z"/></svg></span>&amp; Up</label>
        </div>
        <div class="cf-row">
          <input class="checkbox" type="checkbox" id="rating-3">
          <label class="label" for="rating-3"><span class="cf-rating">3 <svg class="cf-star" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round"><path d="M11.5 2.3a.6.6 0 0 1 1 0l2.6 5.3 5.8.8a.6.6 0 0 1 .3 1l-4.2 4.1 1 5.8a.6.6 0 0 1-.8.6L12 17.2l-5.2 2.7a.6.6 0 0 1-.8-.6l1-5.8-4.2-4.1a.6.6 0 0 1 .3-1l5.8-.8z"/></svg></span>&amp; Up</label>
        </div>
        <div class="cf-row">
          <input class="checkbox" type="checkbox" id="rating-2">
          <label class="label" for="rating-2"><span class="cf-rating">2 <svg class="cf-star" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round"><path d="M11.5 2.3a.6.6 0 0 1 1 0l2.6 5.3 5.8.8a.6.6 0 0 1 .3 1l-4.2 4.1 1 5.8a.6.6 0 0 1-.8.6L12 17.2l-5.2 2.7a.6.6 0 0 1-.8-.6l1-5.8-4.2-4.1a.6.6 0 0 1 .3-1l5.8-.8z"/></svg></span>&amp; Up</label>
        </div>
      </div>
    </details>

    <hr class="separator">

    <details class="collapsible">
      <summary class="collapsible__head">
        <span class="collapsible__title">Brand</span>
        <span class="btn btn--ghost btn--icon-sm collapsible__chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
      </summary>
      <div class="collapsible__content">
        <div class="cf-row"><input class="checkbox" type="checkbox" id="brand-apple"><label class="label" for="brand-apple">Apple</label></div>
        <div class="cf-row"><input class="checkbox" type="checkbox" id="brand-samsung"><label class="label" for="brand-samsung">Samsung</label></div>
        <div class="cf-row"><input class="checkbox" type="checkbox" id="brand-google"><label class="label" for="brand-google">Google</label></div>
        <div class="cf-row"><input class="checkbox" type="checkbox" id="brand-oneplus"><label class="label" for="brand-oneplus">OnePlus</label></div>
        <div class="cf-row"><input class="checkbox" type="checkbox" id="brand-xiaomi"><label class="label" for="brand-xiaomi">Xiaomi</label></div>
      </div>
    </details>

    <hr class="separator">

    <details class="collapsible">
      <summary class="collapsible__head">
        <span class="collapsible__title">Battery</span>
        <span class="btn btn--ghost btn--icon-sm collapsible__chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
      </summary>
      <div class="collapsible__content">
        <div class="cf-row"><input class="checkbox" type="checkbox" id="battery-3500"><label class="label" for="battery-3500">3500mAh</label></div>
        <div class="cf-row"><input class="checkbox" type="checkbox" id="battery-4000"><label class="label" for="battery-4000">4000mAh</label></div>
        <div class="cf-row"><input class="checkbox" type="checkbox" id="battery-5000"><label class="label" for="battery-5000">5000mAh</label></div>
        <div class="cf-row"><input class="checkbox" type="checkbox" id="battery-6000"><label class="label" for="battery-6000">6000mAh</label></div>
      </div>
    </details>

  </div>
</div>
