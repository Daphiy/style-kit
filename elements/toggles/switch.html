<!doctype html>
<meta charset="utf-8">
<title>Toggle preview</title>
<link rel="stylesheet" href="../_preview/preview.css">
<link rel="stylesheet" href="switch.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 200px); row-gap: 28px; align-items: start; }
</style>
<div class="stage" style="width: 600px">
  <div class="grid">
    <div class="toggle" role="switch" aria-checked="false"><span class="toggle__track"></span><span class="toggle__label">Label</span><span class="toggle__text">Text</span></div>
    <div class="toggle" role="switch" aria-checked="false" aria-disabled="true"><span class="toggle__track"></span><span class="toggle__label">Label</span><span class="toggle__text">Text</span></div>
    <div class="toggle" role="switch" aria-checked="true"><span class="toggle__track"></span><span class="toggle__label">Label</span><span class="toggle__text">Text</span></div>

    <div class="toggle toggle--md" role="switch" aria-checked="false"><span class="toggle__track"></span><span class="toggle__label">Label</span><span class="toggle__text">Text</span></div>
    <div class="toggle toggle--md" role="switch" aria-checked="false" aria-disabled="true"><span class="toggle__track"></span><span class="toggle__label">Label</span><span class="toggle__text">Text</span></div>
    <div class="toggle toggle--md" role="switch" aria-checked="true"><span class="toggle__track"></span><span class="toggle__label">Label</span><span class="toggle__text">Text</span></div>

    <div class="toggle toggle--lg" role="switch" aria-checked="false"><span class="toggle__track"></span><span class="toggle__label">Label</span><span class="toggle__text">Text</span></div>
    <div class="toggle toggle--lg" role="switch" aria-checked="false" aria-disabled="true"><span class="toggle__track"></span><span class="toggle__label">Label</span><span class="toggle__text">Text</span></div>
    <div class="toggle toggle--lg" role="switch" aria-checked="true"><span class="toggle__track"></span><span class="toggle__label">Label</span><span class="toggle__text">Text</span></div>
  </div>
</div>
